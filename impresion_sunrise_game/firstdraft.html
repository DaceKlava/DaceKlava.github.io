  schema: {
    speed: { type: 'number', default: 60 },      // degrees per second
    triggerDistance: { type: 'number', default: 1.5 },
    fadeDuration: { type: 'number', default: 1000 },
    soundSrc: { type: 'asset' },      // NEW
    soundVolume: { type: 'number', default: 1 } // NEW
  },

  init: function () {
    this.camera = document.querySelector('[camera]');
    this.triggered = false;

    // Enable opacity
    this.el.setAttribute('material', {
      transparent: true,
      opacity: 1
    });

    // Attach sound if provided
    if (this.data.soundSrc) {
      this.el.setAttribute('sound', {
        src: this.data.soundSrc,
        volume: this.data.soundVolume,
        autoplay: false
      });
     } 
  },

  tick: function (time, timeDelta) {
    // Rotate around Z axis, changed z to y
    const rotation = this.el.getAttribute('rotation');
    rotation.y += (this.data.speed * timeDelta) / 1000;
    this.el.setAttribute('rotation', rotation);

    if (this.triggered || !this.camera) return;

    // Distance check
    const objPos = new THREE.Vector3();
    const camPos = new THREE.Vector3();

    this.el.object3D.getWorldPosition(objPos);
    this.camera.object3D.getWorldPosition(camPos);

    if (objPos.distanceTo(camPos) <= this.data.triggerDistance) {
      this.triggered = true;
      this.fadeOut();
    }
  },

  fadeOut: function () {
    const el = this.el;

    // ▶ PLAY SOUND
    if (el.components.sound) {
      el.components.sound.playSound();
    }

    el.setAttribute('animation__fade', {
      property: 'material.opacity',
      to: 0,
      dur: this.data.fadeDuration,
      easing: 'easeOutQuad'
    });

    setTimeout(() => {
      if (el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }, this.data.fadeDuration);
  }
});
</script>

<script>
AFRAME.registerComponent('zone-light-trigger', {
  schema: {
    radius: { type: 'number', default: 1.5 },
    light: { type: 'selector' },
    sky: { type: 'selector' },
    lightIntensity: { type: 'number', default: 1.6 },
    skyColor: { type: 'color', default: '#1280de' },
    duration: { type: 'number', default: 2000 }
  },

  init: function () {
    this.camera = document.querySelector('[camera]');
    this.triggered = false;
  },

  tick: function () {
    if (this.triggered || !this.camera) return;

    const zonePos = new THREE.Vector3();
    const camPos = new THREE.Vector3();

    this.el.object3D.getWorldPosition(zonePos);
    this.camera.object3D.getWorldPosition(camPos);

    if (zonePos.distanceTo(camPos) <= this.data.radius) {
      this.triggered = true;
      this.activate();
    }
  },

  activate: function () {
    const { light, sky, lightIntensity, skyColor, duration } = this.data;

    // Animate light intensity
    if (light) {
      light.setAttribute('animation__intensity', {
        property: 'light.intensity',
        from: 0,
        to: lightIntensity,
        dur: duration,
        easing: 'easeOutQuad'
      });
    }

    // Animate sky color
    if (sky) {
      sky.setAttribute('animation__sky', {
        property: 'material.color',
        to: skyColor,
        dur: duration,
        easing: 'easeOutQuad'
      });
    }
  }
});
</script>
